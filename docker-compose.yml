services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: nexuserp-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
    networks:
      - nexuserp-network
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: nexuserp-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nexuserp-network
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: nexuserp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_CENTRAL_DATABASE:-mysql_central}
      MYSQL_USER: ${DB_USERNAME:-nexuserp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - nexuserp-network
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: nexuserp-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexuserp-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: nexuserp-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "${PMA_PORT:-5050}:80"
    networks:
      - nexuserp-network
    depends_on:
      - mysql

  node:
    image: node:22-alpine
    container_name: nexuserp-node
    restart: unless-stopped
    working_dir: /var/www/frontend
    volumes:
      - ./frontend:/var/www/frontend
    ports:
      - "5173:5173"
    networks:
      - nexuserp-network
    command: sh -c "npm install && npm run dev -- --host"

networks:
  nexuserp-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
