services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    container_name: nexuserp-production-app
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - storage_data:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    networks:
      - nexuserp-prod-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nexuserp-production-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/production/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_data:/var/www/certbot:ro
    networks:
      - nexuserp-prod-network
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: nexuserp-production-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_CENTRAL_DATABASE:-mysql_central}
      MYSQL_USER: ${DB_USERNAME:-nexuserp}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - nexuserp-prod-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: nexuserp-production-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redis_prod_data:/data
    networks:
      - nexuserp-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nexuserp-prod-network:
    driver: bridge

volumes:
  mysql_prod_data:
  redis_prod_data:
  storage_data:
  storage_logs:
  certbot_data:
