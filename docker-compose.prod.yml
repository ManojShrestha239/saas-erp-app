services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    container_name: nexuserp-production-app
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - storage_data:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    networks:
      - nexuserp-prod-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nexuserp-production-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/production/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_data:/var/www/certbot:ro
    networks:
      - nexuserp-prod-network
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    container_name: nexuserp-production-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_CENTRAL_DATABASE:-pgsql_central}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - nexuserp-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexuserp-production-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redis_prod_data:/data
    networks:
      - nexuserp-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nexuserp-prod-network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  storage_data:
  storage_logs:
  certbot_data:
