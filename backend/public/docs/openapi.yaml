openapi: 3.0.3
info:
  title: 'NexusERP API Documentation'
  description: 'NexusERP RESTful multi-tenant ERP API for trading, retail, and wholesale.'
  version: 1.0.0
servers:
  -
    url: 'http://demo.nexuserp.test'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Requests require an authenticated tenant session cookie or a Bearer token in the `Authorization` header. Tenant requests must target the tenant subdomain (e.g. `http://{tenant}.nexuserp.test`).'
security:
  -
    default: []
paths:
  /api/v1/accounting/accounts:
    get:
      summary: ''
      operationId: getApiV1AccountingAccounts
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: Unauthenticated.
                  errors: {}
                  code: UNAUTHENTICATED
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated.
                  errors:
                    type: object
                    properties: {}
                  code:
                    type: string
                    example: UNAUTHENTICATED
      tags:
        - Endpoints
    post:
      summary: ''
      operationId: postApiV1AccountingAccounts
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
