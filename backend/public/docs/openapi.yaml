                    example: UNAUTHENTICATED
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-11-10T10:22:00'
                status:
                  type: string
                  description: ''
                  example: posted
                  enum:
                    - draft
                    - pending_approval
                    - posted
                  nullable: true
                description:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                source_type:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: v
                  nullable: true
                source_id:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: d
                  nullable: true
                currency:
                  type: string
                  description: 'Must be 3 characters.'
                  example: ljn
                  nullable: true
                user_id:
                  type: string
                  description: 'Must not be greater than 36 characters.'
                  example: i
                  nullable: true
                lines:
                  type: array
                  description: 'Must have at least 2 items.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      account_id:
                        type: string
                        description: 'Must not be greater than 36 characters.'
                        example: b
                      debit_cents:
                        type: integer
                        description: 'Must be at least 0.'
                        example: 39
                        nullable: true
                      credit_cents:
                        type: integer
                        description: 'Must be at least 0.'
                        example: 84
                        nullable: true
                      description:
                        type: string
                        description: 'Must not be greater than 500 characters.'
                        example: 'Quos velit et fugiat sunt nihil accusantium harum.'
                        nullable: true
                    required:
