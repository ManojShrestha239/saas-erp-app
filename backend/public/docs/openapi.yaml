                example:
                  success: false
                  message: Unauthenticated.
                  errors: {}
                  code: UNAUTHENTICATED
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated.
                  errors:
                    type: object
                    properties: {}
                  code:
                    type: string
                    example: UNAUTHENTICATED
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'Must not be greater than 32 characters.'
                  example: b
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                type:
                  type: string
                  description: ''
                  example: liability
                  enum:
                    - asset
                    - liability
                    - equity
                    - income
                    - expense
                parent_id:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: false
                  nullable: true
                currency:
                  type: string
                  description: 'Must be 3 characters.'
                  example: ngz
                  nullable: true
                description:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: 'Velit et fugiat sunt nihil accusantium.'
                  nullable: true
              required:
